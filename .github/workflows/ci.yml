name: CI

on:
  workflow_dispatch:

jobs:
  rust:
    name: Rust checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            install_linux_deps: true
          # Keep macOS CI on a stable image; macos-latest can jump to new Xcode images
          # before Rust/native dependencies have updated linker search paths.
          - os: macos-15
            install_linux_deps: false
          - os: windows-latest
            install_linux_deps: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: matrix.install_linux_deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libgbm-dev \
            libgtk-3-dev \
            libpipewire-0.3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check Python helper scripts
        shell: bash
        run: python -m py_compile scripts/build_frontend.py scripts/build_tauri_frontend.py scripts/generate_release_manifest.py scripts/install_ocr_models.py scripts/install_paddleocr_onnx_models.py scripts/package_desktop.py scripts/package_macos.py scripts/release_gate.py scripts/release_preflight.py scripts/test_build_frontend.py scripts/test_desktop_bundles.py scripts/test_desktop_qa.py scripts/test_install_ocr_models.py scripts/test_ocr_models.py scripts/test_paddleocr_onnx_installer.py scripts/test_packaging.py scripts/test_release_gate.py scripts/test_release_manifest.py scripts/test_release_signing.py scripts/test_translator_providers.py scripts/verify_desktop_bundles.py scripts/verify_desktop_qa.py scripts/verify_release_signing.py scripts/verify_translator_providers.py scripts/verify_ocr_models.py

      - name: Run Python self-tests
        shell: bash
        run: |
          python scripts/test_build_frontend.py
          python scripts/test_install_ocr_models.py
          python scripts/test_ocr_models.py
          python scripts/test_paddleocr_onnx_installer.py
          python scripts/test_packaging.py
          python scripts/test_desktop_bundles.py
          python scripts/test_release_gate.py
          python scripts/test_release_manifest.py
          python scripts/test_desktop_qa.py
          python scripts/test_release_signing.py
          python scripts/test_translator_providers.py

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build React frontend
        shell: bash
        run: python scripts/build_frontend.py

      - name: Run tests
        shell: bash
        run: |
          cargo_retry() {
            # GitHub-hosted runners occasionally reset crates.io downloads.
            # Retrying the whole cargo command keeps CI stable without hiding test failures.
            local attempt
            for attempt in 1 2 3; do
              "$@" && return 0
              if [ "$attempt" -eq 3 ]; then
                return 1
              fi
              sleep $((attempt * 10))
            done
          }
          cargo_retry cargo test --workspace

      - name: Run clippy
        shell: bash
        run: |
          cargo_retry() {
            # Retry only handles transient dependency downloads; compiler errors still fail.
            local attempt
            for attempt in 1 2 3; do
              "$@" && return 0
              if [ "$attempt" -eq 3 ]; then
                return 1
              fi
              sleep $((attempt * 10))
            done
          }
          cargo_retry cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        shell: bash
        run: |
          cargo_retry() {
            # Keep the final build resilient to intermittent registry/network failures.
            local attempt
            for attempt in 1 2 3; do
              "$@" && return 0
              if [ "$attempt" -eq 3 ]; then
                return 1
              fi
              sleep $((attempt * 10))
            done
          }
          cargo_retry cargo build --workspace
