name: Package Desktop

on:
  workflow_dispatch:
    inputs:
      model_tier:
        description: OCR model tier for Windows packages.
        required: true
        default: tiny
        type: choice
        options:
          - tiny
          - small
          - medium
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MODEL_TIER: ${{ inputs.model_tier || 'tiny' }}

jobs:
  prepare-ocr-models:
    name: Prepare OCR models
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache OCR models
        id: ocr-model-cache
        uses: actions/cache@v4
        with:
          path: |
            models/det.onnx
            models/cls.onnx
            models/rec.onnx
            models/rec_dict.txt
            models/SHA256SUMS
            models/manifest.json
          key: snaptext-ocr-linux-${{ env.MODEL_TIER }}-${{ hashFiles('scripts/install_paddleocr_onnx_models.py') }}

      - name: Install OCR conversion dependencies
        if: steps.ocr-model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Generate ONNX assets once on Linux; Windows runners can fail loading
          # Paddle2ONNX native DLLs, but they can package the generated files.
          python -m pip install --upgrade pip
          python -m pip install paddlepaddle paddleocr paddlex
          paddlex --install paddle2onnx

      - name: Install OCR models
        if: steps.ocr-model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: python scripts/install_paddleocr_onnx_models.py --tier "$MODEL_TIER" --force --skip-smoke-test

      - name: Verify OCR models
        shell: bash
        run: python scripts/verify_ocr_models.py models --require-sha256 --skip-smoke-test

      - name: Upload OCR models
        uses: actions/upload-artifact@v4
        with:
          name: snaptext-ocr-models
          path: |
            models/det.onnx
            models/cls.onnx
            models/rec.onnx
            models/rec_dict.txt
            models/SHA256SUMS
            models/manifest.json
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package ${{ matrix.platform }}
    needs: prepare-ocr-models
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-15
            package_command: python scripts/package_macos.py --skip-dmg --ad-hoc-sign
            artifact_name: snaptext-macos-ad-hoc-app
            artifact_paths: |
              dist/macos
          - platform: windows
            os: windows-latest
            package_command: python scripts/package_desktop.py --bundles nsis --no-sign
            artifact_name: snaptext-windows-nsis
            artifact_paths: |
              dist/nsis

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fakeroot \
            libayatana-appindicator3-dev \
            libgbm-dev \
            libgtk-3-dev \
            libpipewire-0.3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync release version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag version: $GITHUB_REF_NAME"
            exit 1
          fi
          python - "$version" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          root = Path.cwd()

          # Keep the generated binary metadata aligned with the release tag.
          for relative in ("crates/snaptext-tauri/tauri.conf.json", "ui/package.json"):
              path = root / relative
              payload = json.loads(path.read_text(encoding="utf-8"))
              payload["version"] = version
              path.write_text(
                  json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )

          for relative in ("crates/snaptext-core/Cargo.toml", "crates/snaptext-tauri/Cargo.toml"):
              path = root / relative
              text = path.read_text(encoding="utf-8")
              package = re.compile(r'''(?ms)(^\[package\].*?^version\s*=\s*")[^"]+(")''')
              text = package.sub(rf"\g<1>{version}\g<2>", text, count=1)
              if relative.endswith("snaptext-tauri/Cargo.toml"):
                  dependency = re.compile(
                      r'(snaptext-core\s*=\s*\{\s*path\s*=\s*"\.\./snaptext-core",\s*version\s*=\s*")[^"]+(\")'
                  )
                  text = dependency.sub(rf"\g<1>{version}\g<2>", text, count=1)
              path.write_text(text, encoding="utf-8")

          lock_path = root / "Cargo.lock"
          lock = lock_path.read_text(encoding="utf-8")
          for package_name in ("snaptext-core", "snaptext-tauri"):
              package = re.compile(
                  rf'(?ms)(^\[\[package\]\]\s*name\s*=\s*"{re.escape(package_name)}"\s*version\s*=\s*")[^"]+(\")'
              )
              lock = package.sub(rf"\g<1>{version}\g<2>", lock, count=1)
          lock_path.write_text(lock, encoding="utf-8")
          PY
          echo "SNAPTEXT_RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Add python3 shim on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Tauri beforeBuildCommand and packaging scripts call python3.
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/python3" <<'SH'
          #!/usr/bin/env bash
          python "$@"
          SH
          printf '@echo off\r\npython %%*\r\n' > "$RUNNER_TEMP/bin/python3.cmd"
          chmod +x "$RUNNER_TEMP/bin/python3"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: package-${{ matrix.platform }}

      - name: Install Tauri CLI
        shell: bash
        run: |
          if command -v cargo-tauri >/dev/null 2>&1; then
            cargo-tauri --version
            exit 0
          fi

          for attempt in 1 2 3; do
            cargo install tauri-cli --locked && exit 0
            if [[ "$attempt" == "3" ]]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Download OCR models
        if: runner.os != 'macOS'
        uses: actions/download-artifact@v4
        with:
          name: snaptext-ocr-models
          path: models

      - name: Verify OCR model cache
        if: runner.os != 'macOS'
        shell: bash
        run: python scripts/verify_ocr_models.py models --require-sha256 --skip-smoke-test

      - name: Package desktop app
        env:
          SNAPTEXT_SKIP_OCR_SMOKE_TEST: "1"
        shell: bash
        run: ${{ matrix.package_command }}

      - name: Collect artifacts
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            macos)
              test -s dist/macos/SnapText-macos-ad-hoc-signed.app.zip
              ;;
            windows)
              rm -rf dist/nsis
              mkdir -p dist/nsis
              cp target/release/bundle/nsis/*.exe dist/nsis/
              ;;
            linux)
              rm -rf dist/deb
              mkdir -p dist/deb
              cp target/release/bundle/deb/*.deb dist/deb/
              ;;
          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: snaptext-macos-ad-hoc-app
          path: release-assets

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: snaptext-windows-nsis
          path: release-assets

      - name: Prepare release notes and checksums
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          previous_tag="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"

          {
            echo "## 更新内容"
            echo
            echo "> macOS 包已使用 ad-hoc 临时签名，但未经 Apple 公证，首次打开仍会被 Gatekeeper 拦截。请选择以下任一方式："
            echo ">"
            echo "> - 先双击 SnapText.app 一次，然后打开 **系统设置 → 隐私与安全性**，在安全性区域找到 SnapText 并点击「仍要打开」"
            echo "> - 在支持该方式的 macOS 版本中，也可右键点击 SnapText.app →「打开」→「仍要打开」"
            echo
            if [[ -n "$previous_tag" ]]; then
              git log --pretty=format:'- %s (%h)' "$previous_tag..$tag"
            else
              git log --pretty=format:'- %s (%h)' "$tag"
            fi
            echo
            echo
            echo "---"
            echo
            if [[ -n "$previous_tag" ]]; then
              echo "完整更新日志: [$previous_tag...$tag](https://github.com/${GITHUB_REPOSITORY}/compare/$previous_tag...$tag)"
            else
              echo "完整更新日志: [$tag](https://github.com/${GITHUB_REPOSITORY}/releases/tag/$tag)"
            fi
          } > CHANGES.md

          find release-assets -type f -print0 \
            | sort -z \
            | xargs -0 shasum -a 256 \
            | sed 's#release-assets/##' > checksums.txt

          cp CHANGES.md release-assets/CHANGES.md
          cp checksums.txt release-assets/checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            # A tag workflow may be rerun after correcting packaging metadata.
            # Remove only release-owned assets so a stale installer filename
            # cannot remain alongside the corrected artifact.
            while IFS= read -r asset; do
              case "$asset" in
                SnapText_*|SnapText-*.zip|CHANGES.md|checksums.txt)
                  gh release delete-asset "$tag" "$asset" --yes
                  ;;
              esac
            done < <(gh release view "$tag" --json assets --jq '.assets[].name')
            gh release upload "$tag" release-assets/*
            gh release edit "$tag" \
              --title "$tag" \
              --notes-file CHANGES.md \
              --latest
          else
            gh release create "$tag" release-assets/* \
              --title "$tag" \
              --notes-file CHANGES.md \
              --latest
          fi
