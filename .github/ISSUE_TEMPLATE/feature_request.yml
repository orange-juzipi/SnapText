name: Feature request
description: 提议一个可验证的新功能或改进
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明当前工作流中的具体痛点和受影响的用户。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述你期望的交互、行为或 API 变化。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 说明你考虑过的替代做法，以及它们为何不适合。
