[package]
name = "snaptext-tauri"
version = "0.1.2"
description = "Tauri desktop shell for SnapText."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
base64.workspace = true
image.workspace = true
snaptext-core = { path = "../snaptext-core", version = "0.1.2" }
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-global-shortcut.workspace = true
tempfile = "3.27.0"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-avf-audio = { workspace = true, features = ["AVAudioApplication", "AVAudioBuffer", "AVAudioEngine", "AVAudioFormat", "AVAudioIONode", "AVAudioNode", "AVAudioTime", "AVAudioTypes", "block2"] }
objc2-core-audio-types.workspace = true
objc2-foundation.workspace = true
objc2-speech.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dev-dependencies]
